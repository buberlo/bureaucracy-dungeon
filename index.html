<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14121a" />
    <meta
      name="description"
      content="Red Tape Dungeon — a Phaser dungeon crawler where you beat monsters with paperwork, stamps, and a very patient auditor."
    />
    <title>Red Tape Dungeon</title>
    <style>
      :root {
        --bg: #14121a;
        --panel: #1e1b26;
        --edge: #2c2838;
        --accent: #e05252;
        --text: #e8e4f0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        overflow: hidden;
      }

      #game-container {
        position: relative;
        width: min(960px, 100vw - 2rem);
        height: min(640px, 100vh - 5rem);
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--panel);
        border: 2px solid var(--edge);
        border-radius: 6px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }

      #game-container canvas {
        display: block;
      }

      #boot-message {
        text-align: center;
        line-height: 1.7;
        padding: 2rem;
      }

      #boot-message h1 {
        font-size: 1.35rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 0.5rem;
      }

      #boot-message p {
        font-size: 0.9rem;
        opacity: 0.7;
      }

      #boot-message .stamp {
        display: inline-block;
        margin-top: 1rem;
        padding: 0
